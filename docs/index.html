<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Repair Cafe Management App</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Deployment and operations guide for the Repair Cafe Management App" />
    <link rel="icon" type="image/png" href="images/logo.png" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
    <style>
      .app-name-link {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: fit-content;
        max-width: 100%;
      }
      .app-name-brand {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .app-name-logo {
        height: 36px;
        margin-left: 15px;
        width: auto;
        flex-shrink: 0;
      }
      .app-name-subtitle {
        margin-top: 10px;
        font-size: 12px;
        font-weight: normal;
        opacity: 0.7;
        white-space: pre-line;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="app">Loading…</div>
    <script>
      const basePath = (() => {
        let path = window.location.pathname.replace(/index\.html$/, "");
        if (!path.endsWith("/")) path += "/";
        return path;
      })();

      window.$docsify = {
        name: "Repair Cafe Management App",
        repo: "petevieira/repair-cafe-app",
        homepage: "README.md",
        nameLink: "/",
        basePath,
        relativePath: true,
        loadSidebar: "sidebar.md",
        auto2top: true,
        subMaxLevel: 2,
        alias: {
          "/.*/sidebar.md": "/sidebar.md",
        },
        search: {
          placeholder: "Search",
          noData: "No results",
        },
        plugins: [
          function (hook) {
            hook.ready(function () {
              const el = document.querySelector(".app-name-link");
              if (!el || el.querySelector("img")) return;

              const img = document.createElement("img");
              img.src = basePath + "images/logo.png";
              img.alt = "";
              img.className = "app-name-logo";

              const title = document.createElement("span");
              title.className = "app-name-title";
              title.textContent = "Repair Cafe Management App";

              const brand = document.createElement("span");
              brand.className = "app-name-brand";
              brand.append(img, title);

              const subtitle = document.createElement("span");
              subtitle.className = "app-name-subtitle";
              subtitle.textContent = "from\n Tucson Repair Cafe";

              el.replaceChildren(brand, subtitle);
            });
          },
        ],
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  </body>
</html>
